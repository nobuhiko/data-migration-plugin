name: PHPStan
on: [workflow_dispatch, push, pull_request]
env:
  PLUGIN_CODE: DataMigration44
  APP_ENV: "test"
  APP_DEBUG: 0
  DATABASE_URL: "sqlite:///var/eccube.db"
  DATABASE_SERVER_VERSION: 3
  DATABASE_CHARSET: "utf8"

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        eccube_version: ["4.4"]
        php: ["8.2", "8.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: nanasess/setup-php@master
        with:
          php-version: ${{ matrix.php }}

      - name: Archive Plugin
        run: |
          tar cvzf ${GITHUB_WORKSPACE}/${PLUGIN_CODE}.tar.gz ./*

      - name: Checkout EC-CUBE
        uses: actions/checkout@v4
        with:
          repository: "EC-CUBE/ec-cube"
          ref: ${{ matrix.eccube_version }}
          path: "ec-cube"

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        working-directory: "ec-cube"
        run: |
          composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader --ignore-platform-req=ext-redis
          composer require --no-interaction --ignore-platform-req=ext-redis \
            pear/pear-core-minimal:^1.10.10 pear/archive_tar:^1.4.13 nobuhiko/bulk-insert-query:^1.2

      - name: Setup EC-CUBE
        working-directory: "ec-cube"
        run: |
          bin/console doctrine:schema:create
          bin/console eccube:fixtures:load

      - name: Install Plugin
        working-directory: "ec-cube"
        run: |
          bin/console eccube:plugin:install --code=${PLUGIN_CODE} --path=${GITHUB_WORKSPACE}/${PLUGIN_CODE}.tar.gz
          bin/console eccube:plugin:enable --code=${PLUGIN_CODE}
          bin/console cache:clear --no-warmup
          bin/console cache:warmup

      - name: PHPStan
        working-directory: "ec-cube"
        run: vendor/bin/phpstan analyse --level 5 --no-progress --error-format=github app/Plugin/${PLUGIN_CODE}/Controller app/Plugin/${PLUGIN_CODE}/Service app/Plugin/${PLUGIN_CODE}/Form

      - name: Rector (dry-run)
        working-directory: "ec-cube"
        run: vendor/bin/rector process app/Plugin/${PLUGIN_CODE} --dry-run --no-progress-bar
